<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wuolah sin anuncios</title>
<meta name="description" content="Quita los anuncios de los PDF gratuitos de Wuolah. Todo ocurre en tu navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Montserrat:wght@400;700&display=swap">
<style>
  /* Colores y tipografía de pgscom.es */
  :root {
    --bg: #05070d;
    --azul: #93c5fd;
    --texto: rgba(255, 255, 255, 0.85);
    --tenue: rgba(255, 255, 255, 0.6);
    --borde: rgba(255, 255, 255, 0.15);
    --ui: 'Chakra Petch', 'Montserrat', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--texto);
    font: 16px/1.6 'Montserrat', sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(60vw 45vh at 78% 8%, rgba(37, 99, 235, 0.16), transparent 60%),
      radial-gradient(50vw 40vh at 12% 92%, rgba(54, 126, 120, 0.14), transparent 60%);
    background-attachment: fixed;
    display: grid;
    grid-template-rows: 1fr auto;
    justify-items: center;
    padding: 0 16px;
    overflow-x: clip;
  }
  main {
    width: 100%;
    max-width: 760px;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: clamp(28px, 5vh, 44px);
    padding: clamp(32px, 7vh, 72px) 0 24px;
    text-align: center;
  }
  h1 {
    margin: 0 0 14px;
    /* padding: background-clip recorta en la caja de línea */
    padding: 0.08em 0.04em;
    font: 700 clamp(2.4rem, 7vw, 4.6rem)/1.1 var(--ui);
    letter-spacing: -0.01em;
    /* el degradado cian de pgscom: empieza y acaba en el mismo azul, sin salto en el bucle */
    background: linear-gradient(135deg, #0098ff 0%, #00b4d8 25%, #48cae4 50%, #caf0f8 75%, #0098ff 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: brillo 9s linear infinite;
  }
  @keyframes brillo { to { background-position: -200% 0; } }
  .sub {
    margin: 0 auto;
    max-width: 520px;
    font: 500 clamp(0.95rem, 2vw, 1.1rem)/1.5 var(--ui);
    color: var(--tenue);
  }

  /* Zona de soltar: una hoja A4 en cristal oscuro */
  .hoja {
    position: relative;
    height: min(47vh, 500px);
    min-height: 340px;
    aspect-ratio: 210 / 297;
    max-width: 100%;
    display: grid;
    padding: 28px;
    border-radius: 14px;
    border: 1px solid var(--borde);
    background: rgba(255, 255, 255, 0.03);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    cursor: pointer;
    transition: border-color .3s ease, background-color .3s ease;
  }
  .hoja:hover, body.dragging .hoja { border-color: rgba(147, 197, 253, 0.5); background: rgba(147, 197, 253, 0.05); }
  .hoja:has(input:focus-visible) { outline: 2px solid var(--azul); outline-offset: 4px; }
  .hoja input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .reposo { align-self: center; display: grid; justify-items: center; gap: 14px; }
  .reposo svg { color: var(--azul); }
  .reposo strong { font: 600 1.25rem/1.2 var(--ui); color: #fff; }
  .reposo p { margin: 0; color: var(--tenue); font-size: 0.95rem; }
  .error { color: #fca5a5 !important; font-weight: 700; }

  .resultado { display: none; align-content: start; gap: 18px; text-align: left; }
  body.done .reposo { display: none; }
  body.done .resultado { display: grid; }
  body.done main { padding-top: clamp(20px, 4vh, 44px); gap: clamp(20px, 3.5vh, 36px); }
  body.done .hoja { height: auto; aspect-ratio: auto; width: min(100%, 460px); min-height: 0; }

  .paginas {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
    gap: 8px;
  }
  .paginas i {
    aspect-ratio: 210 / 297;
    display: grid;
    place-items: center;
    font: 600 11px/1 var(--ui);
    font-style: normal;
    font-variant-numeric: tabular-nums;
    background: rgba(255, 255, 255, 0.88);
    color: var(--bg);
    border-radius: 3px;
  }
  .paginas i.fuera {
    background: transparent;
    color: var(--azul);
    box-shadow: inset 0 0 0 1px rgba(147, 197, 253, 0.45);
    text-decoration: line-through;
    animation: cae .7s cubic-bezier(.5, 0, .75, 0) both;
  }
  @keyframes cae { to { transform: translateY(6px) rotate(9deg); } }

  .resumen { margin: 0; color: var(--tenue); font-size: 0.95rem; }
  .resumen b {
    display: block;
    margin-bottom: 6px;
    color: #fff;
    font: 600 clamp(1.5rem, 4vw, 2rem)/1.15 var(--ui);
  }
  /* Botón principal blanco, como "Ver en GitHub" en las fichas de pgscom */
  .descargar {
    justify-self: start;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 26px;
    border-radius: 6px;
    background: #fff;
    color: var(--bg);
    font: 600 1rem/1 var(--ui);
    text-decoration: none;
    transition: background-color .25s ease;
  }
  .descargar svg { transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .descargar:hover { background: #dbeafe; }
  .descargar:hover svg { transform: translateY(2px); }
  .descargar:focus-visible { outline: 2px solid var(--azul); outline-offset: 3px; }
  .otra { margin: 0; font-size: 0.85rem; color: var(--tenue); }

  footer {
    padding: 0 0 28px;
    text-align: center;
    font: 500 0.85rem/1.5 var(--ui);
    color: rgba(255, 255, 255, 0.45);
  }
  @media (max-width: 520px) {
    .hoja { width: 100%; height: auto; aspect-ratio: auto; min-height: 360px; padding: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none; }
    .paginas i.fuera { animation: none; transform: translateY(6px) rotate(9deg); }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Wuolah sin anuncios</h1>
    <p class="sub">Quita banners, portada y páginas de publicidad de tus apuntes, sin perder calidad.</p>
  </header>

  <label class="hoja">
    <input type="file" id="file" accept="application/pdf,.pdf">
    <div class="reposo">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 5H11a3 3 0 0 0-3 3v24a3 3 0 0 0 3 3h18a3 3 0 0 0 3-3V14z"/><path d="M23 5v9h9M20 29V19M15.5 23.5 20 19l4.5 4.5"/></svg>
      <strong>Suelta aquí el PDF</strong>
      <p>o haz clic para elegirlo</p>
      <p class="error" id="error" role="alert" hidden></p>
    </div>
    <div class="resultado" aria-live="polite">
      <div class="paginas" id="pages"></div>
      <p class="resumen" id="summary"></p>
      <a class="descargar" id="download" href="#">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5v8.5M5 7.5 9 11.5l4-4M3 15.5h12"/></svg>
        Descargar PDF limpio
      </a>
      <p class="otra">Haz clic en la hoja o suelta otro PDF para seguir.</p>
    </div>
  </label>
</main>
<footer>Todo ocurre en tu navegador: el PDF no se sube a ningún sitio.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="premiumize.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let url;

  async function handle(file) {
    if (!file) return;
    const err = $('error');
    err.hidden = true;
    document.body.classList.remove('done');
    try {
      const r = await premiumize(new Uint8Array(await file.arrayBuffer()), PDFLib);
      const kept = new Set(r.kept);
      $('pages').innerHTML = Array.from({ length: r.total }, (_, i) =>
        `<i class="${kept.has(i) ? '' : 'fuera'}" style="animation-delay:${i * 25}ms">${i + 1}</i>`).join('');
      const gone = r.total - r.kept.length;
      $('summary').innerHTML = `<b>${r.total} páginas → ${r.kept.length}</b>` +
        `${gone} ${gone === 1 ? 'página fuera' : 'páginas fuera'} (portada y anuncios). ` +
        `Banners, marcas y enlaces de tracking quitados del resto.`;
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(new Blob([r.bytes], { type: 'application/pdf' }));
      const a = $('download');
      a.href = url;
      a.download = file.name.replace(/\.pdf$/i, '') + '-sin-anuncios.pdf';
      document.body.classList.add('done');
    } catch (e) {
      console.error(e);
      err.textContent = /Wuolah|contenido/.test(e.message) ? e.message : 'No se ha podido leer ese PDF.';
      err.hidden = false;
    }
  }

  $('file').addEventListener('change', (e) => { handle(e.target.files[0]); e.target.value = ''; });
  let depth = 0;
  addEventListener('dragenter', (e) => { e.preventDefault(); depth++; document.body.classList.add('dragging'); });
  addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
  addEventListener('dragover', (e) => e.preventDefault());
  addEventListener('drop', (e) => {
    e.preventDefault();
    depth = 0;
    document.body.classList.remove('dragging');
    handle(e.dataTransfer.files[0]);
  });
</script>
</body>
</html>
